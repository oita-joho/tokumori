<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>得点集計</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>得点集計</h1>
      <p>30人 × 8クラスの得点を保存できます</p>
    </header>

    <section class="card">
      <div class="settings">
        <div>
          <label>日付</label>
          <input type="date" id="dateInput">
        </div>

        <div>
          <label>テーマ</label>
          <input type="text" id="themeInput" placeholder="例：小テスト">
        </div>

        <div>
          <label>満点</label>
          <input type="number" id="maxScoreInput" min="1" value="100">
        </div>

        <div>
          <label>クラス</label>
          <select id="classSelect">
            <option value="1">1組</option>
            <option value="2">2組</option>
            <option value="3">3組</option>
            <option value="4">4組</option>
            <option value="5">5組</option>
            <option value="6">6組</option>
            <option value="7">7組</option>
            <option value="8">8組</option>
          </select>
        </div>
      </div>

      <div class="buttons">
        <button id="saveBtn">保存</button>
        <button id="csvBtn">CSV出力</button>
        <button id="clearBtn" class="danger">このクラスを初期化</button>
      </div>

      <div id="status" class="status"></div>
    </section>

    <section class="summary">
      <div>人数：<strong id="countText">0</strong>人</div>
      <div>合計：<strong id="sumText">0</strong>点</div>
      <div>平均：<strong id="avgText">0</strong>点</div>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th>番号</th>
            <th>名前</th>
            <th>得点</th>
          </tr>
        </thead>
        <tbody id="scoreBody"></tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
